<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gadget List | Singularity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        input[type="text"], textarea, select {
            border: none; background: transparent; color: inherit;
            outline: none; font-family: inherit; padding: 2px 5px;
        }
        textarea { resize: none; width: 100%; display: block; }
        input[type="text"]:focus, textarea:focus, select:focus { background: rgba(0, 123, 255, 0.1); }
        select { cursor: pointer; }

        /* Header Styling */
        .hero-header { display: flex; align-items: center; gap: 15px; border-bottom: 3px solid #000; padding-bottom: 5px; }
        .hero-header h1 { margin: 0; font-size: 2rem; font-weight: 800; text-transform: uppercase; }
        .hero-header input { font-size: 2rem; font-weight: bold; }

        .gadget-slot { border: 1px solid #ced4da; min-height: 50px; background: #fff; padding: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .gadget-slot input[type="text"] { 
            border: 1px solid #ddd; 
            border-radius: 3px; 
            padding: 4px 8px; 
            background: #fff; 
            width: 100%;
            box-sizing: border-box;
        }
        .gadget-slot input[type="text"]:focus { 
            border: 2px solid #007bff; 
            outline: none; 
        }
        .gadget-level-header { background: #f8f9fa; border: 2px solid #000; padding: 10px; margin-bottom: 10px; font-weight: bold; }
        .gadget-column-header { border: 1px solid #ced4da; background: #f8f9fa; padding: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9rem; }
        .gadget-slot-checkbox { width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
        .gadget-checkbox-container { width: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .gadget-slot-name { width: 200px; flex-shrink: 0; display: flex; flex-direction: column; }
        .gadget-slot-name input { width: 100%; min-width: 0; flex: 1; }
        .gadget-slot-desc { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        .gadget-slot-desc input { width: 100%; min-width: 0; flex: 1; }
        .mobile-label { display: none; }
        .gadget-column-available { width: 80px; flex-shrink: 0; text-align: center; }
        .gadget-column-name { width: 200px; flex-shrink: 0; }
        .gadget-column-desc { flex: 1; min-width: 0; }
        select { width: auto; display: inline-block; padding: 5px 10px; border: 1px solid #ced4da; border-radius: 4px; background-color: #fff; color: #000; }

        /* Dark Mode */
        body.dark-mode { background-color: #121212 !important; color: #e0e0e0 !important; }
        .dark-mode .card { background-color: #1e1e1e !important; border-color: #333 !important; color: #e0e0e0; }
        .dark-mode .card-header { background-color: #2d2d2d !important; color: #fff !important; }
        .dark-mode .gadget-slot { background-color: #1e1e1e !important; border-color: #444 !important; }
        .dark-mode .gadget-level-header { background-color: #2d2d2d !important; border-color: #fff !important; }
        .dark-mode .gadget-column-header { background-color: #2d2d2d !important; border-color: #444 !important; }
        .dark-mode .gadget-slot input[type="text"] { border-color: #555 !important; background-color: #2d2d2d !important; }
        .dark-mode .gadget-slot input[type="text"]:focus { border-color: #00d4ff !important; }
        .dark-mode .table { color: #e0e0e0 !important; border-color: #444 !important; }
        .dark-mode .table thead th { background-color: #343a40 !important; color: #fff !important; border-color: #444 !important; }
        .dark-mode .table td { background-color: #1e1e1e !important; border-color: #444 !important; }
        .dark-mode .hero-header { border-color: #fff !important; }
        .dark-mode .text-muted, .dark-mode small { color: #ffffff !important; opacity: 1; font-weight: 500; }
        .dark-mode select { background-color: #1e1e1e !important; color: #e0e0e0 !important; border-color: #444 !important; }
        .dark-mode select option { background-color: #1e1e1e !important; color: #e0e0e0 !important; }
        .dark-mode select:focus { background-color: #1e1e1e !important; color: #e0e0e0 !important; }
        .dark-mode input[type="checkbox"] { accent-color: #00d4ff; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .d-flex.justify-content-end {
                flex-wrap: wrap;
            }
            .d-flex.justify-content-end button {
                flex: 1;
                min-width: calc(50% - 5px);
            }
            .d-flex.align-items-center {
                flex-wrap: wrap;
                gap: 10px !important;
            }
            .d-flex.align-items-center label {
                width: 100%;
            }
            .d-flex.align-items-center select {
                flex: 1;
                min-width: 100px;
            }
            .gadget-slot {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .gadget-column-header {
                display: none; /* Hide column headers on mobile */
            }
            .gadget-slot {
                padding: 12px;
            }
            .gadget-checkbox-container {
                width: 100%;
                justify-content: flex-start;
                margin-bottom: 5px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .gadget-checkbox-container .mobile-label {
                margin-bottom: 0;
            }
            .mobile-label {
                display: block;
                font-weight: bold;
                margin-bottom: 4px;
                font-size: 0.9rem;
            }
            .gadget-slot-name {
                width: 100%;
            }
            .gadget-slot-desc {
                width: 100%;
                min-width: 0;
            }
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; color: black !important; }
            .hero-header { border-color: black !important; }
            .gadget-level-header { border-color: black !important; }
        }
    </style>
    <link rel="icon" href="../../../img/infinitylogo.png">
</head>

<body>
<div class="container mt-4 pb-5">
    <div class="mb-3 no-print">
        <div class="d-flex justify-content-end gap-2 mb-2">
            <button onclick="toggleDarkMode()" class="btn btn-sm btn-outline-primary" id="themeBtn">Dark Mode</button>
            <button onclick="clearSheet()" class="btn btn-sm btn-outline-danger">Clear Sheet</button>
            <button onclick="window.print()" class="btn btn-sm btn-success">Save as PDF</button>
        </div>
        <div class="d-flex align-items-center gap-2">
            <label for="gadgeteer_level" class="mb-0"><strong>Gadgeteer Level:</strong></label>
            <select id="gadgeteer_level" onchange="updateGadgetSlots()">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
            </select>
            <button onclick="longRest()" class="btn btn-sm btn-outline-info">Long Rest</button>
        </div>
    </div>

    <div id="gadget-container">
        <!-- Gadget slots will be dynamically generated here -->
    </div>

    <p class="mt-5 no-print text-center">
        <a href="../../character_creation.html" class="text-info text-decoration-none">&larr; Back to Step-by-Step Character Creation</a>
    </p>
</div>

<script>
    // Gadget slot data per level (level 0-10, counts per gadgeteer level 1-20)
    const gadgetData = {
        1: {0: 4, 1: 2},
        2: {0: 4, 1: 3},
        3: {0: 4, 1: 3, 2: 1},
        4: {0: 4, 1: 3, 2: 2},
        5: {0: 5, 1: 3, 2: 2, 3: 1},
        6: {0: 5, 1: 3, 2: 2, 3: 2},
        7: {0: 5, 1: 3, 2: 2, 3: 2, 4: 1},
        8: {0: 5, 1: 3, 2: 2, 3: 2, 4: 2},
        9: {0: 6, 1: 3, 2: 2, 3: 2, 4: 2, 5: 1},
        10: {0: 6, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2},
        11: {0: 6, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 1},
        12: {0: 6, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2},
        13: {0: 7, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 1},
        14: {0: 7, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2},
        15: {0: 7, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2, 8: 1},
        16: {0: 7, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2, 8: 2},
        17: {0: 8, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2, 8: 2, 9: 1},
        18: {0: 8, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2, 8: 2, 9: 2},
        19: {0: 8, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2, 8: 2, 9: 2, 10: 1},
        20: {0: 8, 1: 3, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2, 8: 2, 9: 2, 10: 2}
    };

    function updateGadgetSlots() {
        const level = parseInt(document.getElementById('gadgeteer_level').value);
        const container = document.getElementById('gadget-container');
        const levelData = gadgetData[level];
        
        container.innerHTML = '';
        
        // Create sections for each gadget level (0-10)
        for (let gadgetLevel = 0; gadgetLevel <= 10; gadgetLevel++) {
            const count = levelData[gadgetLevel];
            if (count && count > 0) {
                const levelDiv = document.createElement('div');
                levelDiv.className = 'mb-4';
                
                const header = document.createElement('div');
                header.className = 'gadget-level-header';
                header.textContent = `Level ${gadgetLevel} Gadgets (${count} slot${count > 1 ? 's' : ''})`;
                levelDiv.appendChild(header);
                
                // Create column header row
                const columnHeader = document.createElement('div');
                columnHeader.className = 'gadget-column-header';
                
                if (gadgetLevel > 0) {
                    const availableLabel = document.createElement('div');
                    availableLabel.className = 'gadget-column-available';
                    availableLabel.textContent = 'Available';
                    availableLabel.title = 'Check when the gadget is available (unused)';
                    columnHeader.appendChild(availableLabel);
                }
                
                const nameLabel = document.createElement('div');
                nameLabel.className = 'gadget-column-name';
                nameLabel.textContent = 'Name';
                columnHeader.appendChild(nameLabel);
                
                const descLabel = document.createElement('div');
                descLabel.className = 'gadget-column-desc';
                descLabel.textContent = 'Description';
                columnHeader.appendChild(descLabel);
                
                levelDiv.appendChild(columnHeader);
                
                // Create slots for this gadget level
                for (let i = 1; i <= count; i++) {
                    const slotDiv = document.createElement('div');
                    slotDiv.className = 'gadget-slot';
                    slotDiv.id = `gadget_${gadgetLevel}_${i}`;
                    
                    // Add checkbox only for Level 1+ gadgets
                    if (gadgetLevel > 0) {
                        const checkboxContainer = document.createElement('div');
                        checkboxContainer.className = 'gadget-checkbox-container';
                        const checkboxLabel = document.createElement('label');
                        checkboxLabel.setAttribute('for', `gadget_${gadgetLevel}_${i}_used`);
                        checkboxLabel.className = 'mobile-label';
                        checkboxLabel.textContent = 'Available:';
                        checkboxContainer.appendChild(checkboxLabel);
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = `gadget_${gadgetLevel}_${i}_used`;
                        checkbox.className = 'gadget-slot-checkbox';
                        checkbox.checked = true; // Default to available (checked = available)
                        checkboxContainer.appendChild(checkbox);
                        slotDiv.appendChild(checkboxContainer);
                    }
                    
                    const nameContainer = document.createElement('div');
                    nameContainer.className = 'gadget-slot-name';
                    const nameLabel = document.createElement('label');
                    nameLabel.setAttribute('for', `gadget_${gadgetLevel}_${i}_name`);
                    nameLabel.className = 'mobile-label';
                    nameLabel.textContent = 'Name:';
                    nameContainer.appendChild(nameLabel);
                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.id = `gadget_${gadgetLevel}_${i}_name`;
                    nameContainer.appendChild(nameInput);
                    slotDiv.appendChild(nameContainer);
                    
                    const descContainer = document.createElement('div');
                    descContainer.className = 'gadget-slot-desc';
                    const descLabel = document.createElement('label');
                    descLabel.setAttribute('for', `gadget_${gadgetLevel}_${i}_desc`);
                    descLabel.className = 'mobile-label';
                    descLabel.textContent = 'Description:';
                    descContainer.appendChild(descLabel);
                    const descInput = document.createElement('input');
                    descInput.type = 'text';
                    descInput.id = `gadget_${gadgetLevel}_${i}_desc`;
                    descContainer.appendChild(descInput);
                    slotDiv.appendChild(descContainer);
                    
                    levelDiv.appendChild(slotDiv);
                }
                
                container.appendChild(levelDiv);
            }
        }
        
        // Load saved data
        loadSavedData();
        
        // Attach event listeners to new inputs
        attachEventListeners();
    }

    function attachEventListeners() {
        const allInputs = document.querySelectorAll('#gadget-container input, #gadget-container textarea');
        allInputs.forEach(el => {
            if (el.id) {
                if (el.type === 'checkbox') {
                    el.addEventListener('change', () => {
                        localStorage.setItem('gadget_' + el.id, el.checked);
                    });
                } else {
                    el.addEventListener('input', () => {
                        localStorage.setItem('gadget_' + el.id, el.value);
                    });
                }
            }
        });
    }

    function loadSavedData() {
        const allInputs = document.querySelectorAll('#gadget-container input, #gadget-container textarea');
        allInputs.forEach(el => {
            if (el.id) {
                const val = localStorage.getItem('gadget_' + el.id);
                if (val !== null) {
                    if (el.type === 'checkbox') {
                        el.checked = val === 'true';
                    } else {
                        el.value = val;
                    }
                }
            }
        });
    }

    function toggleDarkMode() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        body.classList.toggle('dark-mode');
        btn.innerText = body.classList.contains('dark-mode') ? "Light Mode" : "Dark Mode";
        localStorage.setItem('singularity_darkMode', body.classList.contains('dark-mode'));
    }

    function longRest() {
        // Mark all Level 1+ gadgets as available (check all checkboxes)
        const allCheckboxes = document.querySelectorAll('#gadget-container input[type="checkbox"]');
        allCheckboxes.forEach(checkbox => {
            checkbox.checked = true;
            if (checkbox.id) {
                localStorage.setItem('gadget_' + checkbox.id, 'true');
            }
        });
    }

    function clearSheet() {
        if (confirm("Delete all gadget data? This cannot be undone.")) {
            const allInputs = document.querySelectorAll('input, textarea');
            allInputs.forEach(el => {
                if (el.id && el.id.startsWith('gadget_')) {
                    if (el.type === 'checkbox') {
                        el.checked = false;
                    } else {
                        el.value = '';
                    }
                    localStorage.removeItem('gadget_' + el.id);
                }
            });
        }
    }

    // Load saved level and name
    window.onload = () => {
        const savedLevel = localStorage.getItem('gadgeteer_level');
        if (savedLevel) {
            document.getElementById('gadgeteer_level').value = savedLevel;
        }
        if (localStorage.getItem('singularity_darkMode') === 'true') toggleDarkMode();
        updateGadgetSlots();
    };

    // Save level changes
    document.getElementById('gadgeteer_level').addEventListener('change', () => {
        localStorage.setItem('gadgeteer_level', document.getElementById('gadgeteer_level').value);
    });
</script>
</body>
</html>
